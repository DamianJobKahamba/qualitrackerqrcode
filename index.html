<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Digital Contact Page</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <!-- Background overlay -->
    <div class="background-overlay"></div>

    <!-- Menu -->
    <button class="menu-button" id="menuButton" aria-label="Open menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- Slide menu -->
    <aside class="side-menu" id="sideMenu">
      <button class="close-menu" id="closeMenu">×</button>

      <nav>
        <a href="#home">Home</a>
        <a href="#contact">Contact</a>
        <a href="#social">Social Links</a>
      </nav>
    </aside>

    <!-- Main content -->
    <section class="content" id="home">

      <!-- Logo -->
      <div class="logo-wrapper">
        <img
          src="assets/logo.png"
          alt="Company Logo"
          class="logo"
        >
      </div>

      <!-- Business information -->
      <div class="intro">
        <h1>Your Business Name</h1>

        <p class="business-type">
          Business Category
        </p>

        <p class="tagline">
          "Your business tagline goes here."
        </p>
      </div>

      <!-- Quick Actions -->
      <div class="quick-actions">

        <a
          href="tel:+255000000000"
          class="quick-button"
          aria-label="Call"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6.6 10.8c1.5 3 3.9 5.4 6.9 6.9l2.3-2.3c.3-.3.7-.4 1.1-.3
            1.2.4 2.5.6 3.8.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.8 21
            3 13.2 3 3.7c0-.6.4-1 1-1h3.3c.6 0 1 .4 1 1
            0 1.3.2 2.6.6 3.8.1.4 0 .8-.3 1.1l-2.3 2.2z"/>
          </svg>
        </a>

        <a
          href="mailto:your@email.com"
          class="quick-button"
          aria-label="Email"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16
            a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/>
          </svg>
        </a>

        <a
          href="https://wa.me/255000000000"
          target="_blank"
          class="quick-button"
          aria-label="WhatsApp"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.5 3.5A11.7 11.7 0 0 0 12.1 0
            11.8 11.8 0 0 0 1.9 17.7L0 24l6.5-1.7
            A11.9 11.9 0 0 0 12.1 24h.1A11.8
            11.8 0 0 0 20.5 3.5z"/>
          </svg>
        </a>

      </div>

      <!-- Contact card -->
      <section class="card contact-card" id="contact">

        <div class="card-title-row">

          <div class="round-dark-icon">
            <svg viewBox="0 0 24 24">
              <path d="M6.6 10.8c1.5 3 3.9 5.4 6.9 6.9l2.3-2.3
              c.3-.3.7-.4 1.1-.3 1.2.4 2.5.6 3.8.6.6 0
              1 .4 1 1V20c0 .6-.4 1-1 1C10.8 21 3
              13.2 3 3.7c0-.6.4-1 1-1h3.3c.6 0
              1 .4 1 1 0 1.3.2 2.6.6 3.8.1.4
              0 .8-.3 1.1l-2.3 2.2z"/>
            </svg>
          </div>

          <h2>Contact Us</h2>

        </div>

        <div class="divider"></div>

        <div class="contact-block">
          <span class="label">Call Us</span>

          <a href="tel:+255000000000">
            +255 000 000 000
          </a>
        </div>

        <div class="contact-block">
          <span class="label">Email</span>

          <a href="mailto:your@email.com">
            your@email.com
          </a>
        </div>

        <div class="contact-block">
          <span class="label">Location</span>

          <p>
            Your Area<br>
            Dar es Salaam<br>
            Tanzania
          </p>
        </div>

        <a
          class="direction-button"
          href="https://maps.google.com/"
          target="_blank"
        >
          <span>↗</span>
          Direction
        </a>

      </section>


      <!-- Social links -->
      <section id="social" class="social-section">

        <div class="card social-header">
          <h2>Social Links</h2>
          <p>Reach us through</p>
        </div>


        <!-- WhatsApp -->
        <a
          href="https://wa.me/255000000000"
          target="_blank"
          class="social-card"
        >

          <div class="social-icon whatsapp">
            W
          </div>

          <span>WhatsApp</span>

          <span class="arrow">›</span>

        </a>


        <!-- Instagram -->
        <a
          href="https://instagram.com/"
          target="_blank"
          class="social-card"
        >

          <div class="social-icon instagram">
            I
          </div>

          <span>Instagram</span>

          <span class="arrow">›</span>

        </a>


        <!-- Email -->
        <a
          href="mailto:your@email.com"
          class="social-card"
        >

          <div class="social-icon email-icon">
            ✉
          </div>

          <span>Email</span>

          <span class="arrow">›</span>

        </a>

      </section>

    </section>


    <!-- Bottom-left buttons -->
    <div class="bottom-actions">

      <button
        class="floating-circle"
        id="qrButton"
        aria-label="QR code"
      >
        ▦
      </button>

      <button
        class="floating-circle"
        id="shareButton"
        aria-label="Share"
      >
        ↑
      </button>

    </div>


    <!-- Add to contact -->
    <button
      class="add-contact"
      id="addContactButton"
    >

      <span class="add-contact-text">
        Add to<br>Contact
      </span>

      <span class="plus-circle">
        +
      </span>

    </button>


    <!-- QR modal -->
    <div class="modal" id="qrModal">

      <div class="modal-box">

        <button
          class="modal-close"
          id="closeQr"
        >
          ×
        </button>

        <h3>Scan QR Code</h3>

        <img
          src="assets/qr-code.png"
          alt="QR Code"
          class="qr-image"
        >

      </div>

    </div>

  </main>

  <script src="script.js"></script>

</body>
</html>
